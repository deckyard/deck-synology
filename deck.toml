[package]
name = "@deckyard/synology"
version = "0.1.0"
description = "A client for the Synology DSM Web API: File Station, virtual machines, users and shares, administration and Container Manager"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The deck talks to a DSM host over HTTPS, so it opens sockets. No `exec`:
# it shells out to nothing. No `sql`.
capabilities = ["net"]
keywords = ["synology", "dsm", "nas", "filestation", "homelab", "storage", "docker", "virtualization", "api"]

[package.urls]
deck = "https://raw.githubusercontent.com/deckyard/deck-synology/main/deck.toml"
homepage = "https://github.com/deckyard/deck-synology"
manual = "https://deckyard.github.io/deck-synology/"

# Only the default binary: `jennifer-tiny` has no `net` capability.
[engines]
jennifer = ">=0.25.0"
